<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rally Printstudio</title>
    <meta name="description" content="Parametrische 3D-printontwerpen voor Bambu Lab-printers (standaard de A2L): vazen, lampenkappen, Gridfinity, grepen, verbinders, meubels en zelfwaterende plantenpotten." />
    <meta name="theme-color" content="#e9eaec" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111111'/%3E%3Cpath d='M9 23V9h8a4.5 4.5 0 0 1 0 9h-8M16 18l6 5' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Rally Printstudio">
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" /><path d="M9 23V9h8a4.5 4.5 0 0 1 0 9h-8M16 18l6 5" /></svg>
          <span><b>Rally</b> <span class="brand-sub">Printstudio</span></span>
        </a>
        <nav class="tools" id="tools" aria-label="Gereedschap"></nav>
        <div class="top-actions">
          <label class="printer">
            <span class="printer-label">Printer</span>
            <select id="printer" aria-label="Printer"></select>
          </label>
          <button id="theme" class="icon-btn" type="button" aria-label="Thema"></button>
        </div>
      </header>
      <main class="layout">
        <aside class="panel params">
          <div class="intro">
            <h1 id="tool-title">Rally</h1>
            <p id="tool-desc"></p>
          </div>
          <div class="preset-row">
            <select id="presets" aria-label="Voorbeelden"></select>
            <button id="random" class="ghost" type="button" title="Willekeurig ontwerp">Verras me</button>
            <button id="reset" class="ghost" type="button" title="Standaardwaarden">Reset</button>
          </div>
          <div id="error" class="callout error" role="alert" hidden></div>
          <div id="outliner" class="outliner" hidden></div>
          <div id="form-head" class="form-head">
            <button id="back-to-stack" class="ghost small" type="button">← Terug naar de stapel</button>
            <span class="muted small">Alle instellingen</span>
          </div>
          <div id="form"></div>
        </aside>
        <section class="stage" aria-label="3D-voorbeeld">
          <div id="viewer" class="viewer"></div>
          <svg id="gizmo" class="gizmo" aria-hidden="false"></svg>
          <div id="nodeview" class="nodeview" hidden></div>
          <div class="stage-bar">
            <div class="stage-left">
              <div class="tgroup" role="toolbar" aria-label="Bewerken">
                <button id="undo" class="tbtn" type="button" title="Ongedaan maken (Ctrl+Z)" aria-label="Ongedaan maken" disabled></button>
                <button id="redo" class="tbtn" type="button" title="Opnieuw (Ctrl+Shift+Z)" aria-label="Opnieuw" disabled></button>
                <span class="tsep"></span>
                <button id="lib-open" class="tbtn" type="button" title="Bibliotheek: bewaar en laad ontwerpen"></button>
                <button id="share-top" class="tbtn" type="button" title="Kopieer een link naar dit ontwerp"></button>
              </div>
              <div class="seg" id="stage-tabs" hidden>
                <button type="button" data-tab="3d" aria-pressed="true">3D</button>
                <button type="button" data-tab="nodes" aria-pressed="false">Nodes</button>
              </div>
              <div class="seg" id="view-toggle" hidden>
                <button type="button" data-view="assembly" aria-pressed="true">Samengesteld</button>
                <button type="button" data-view="plate" aria-pressed="false">Printplaat</button>
              </div>
            </div>
            <div class="stage-tools">
              <label class="pill-toggle"><input type="checkbox" id="section" /> Doorsnede</label>
              <div class="seg">
                <button type="button" data-cam="iso" title="Schuin aanzicht">3D</button>
                <button type="button" data-cam="front" title="Vooraanzicht">Voor</button>
                <button type="button" data-cam="top" title="Bovenaanzicht">Boven</button>
                <button type="button" data-cam="fit" title="Alles in beeld">⤢</button>
              </div>
            </div>
          </div>
          <div id="busy" class="busy" hidden><span class="spinner"></span>Rekenen…</div>
          <div id="stage-error" class="stage-error" role="status" hidden></div>
          <div id="toast" class="toast" role="status" hidden></div>
          <div class="stage-foot">
            <div id="stats" class="stats"></div>
            <div id="swatches" class="swatches" aria-label="Voorbeeldkleur"></div>
          </div>
        </section>
        <aside class="panel output">
          <button id="sheet-handle" class="sheet-handle" type="button" aria-label="Paneel uitklappen" hidden><span></span></button>
          <div id="right-tabs" class="panel-tabs seg" hidden>
            <button type="button" data-rtab="inspect" aria-pressed="true">Eigenschappen</button>
            <button type="button" data-rtab="print" aria-pressed="false">Printen</button>
          </div>
          <div id="inspector" class="inspector" hidden></div>
          <div id="output-body" class="output-body">
          <div class="export">
            <button id="export-3mf" class="primary" type="button">Download 3MF voor Bambu Studio</button>
            <div class="export-row">
              <button id="export-stl" class="ghost" type="button">STL (alles)</button>
              <button id="share" class="ghost" type="button">Deel ontwerp</button>
            </div>
            <div id="plate-exports" class="plate-exports"></div>
          </div>
          <div id="warnings"></div>
          <section class="info-block">
            <h3>Onderdelen</h3>
            <div id="parts"></div>
          </section>
          <section class="info-block">
            <h3>Filament</h3>
            <div id="filament" class="filament"></div>
          </section>
          <section class="info-block shopping" id="shopping">
            <div class="shop-head">
              <h3>Boodschappenlijst</h3>
              <div class="shop-actions">
                <button id="shop-copy" class="ghost small" type="button">Kopieer lijst</button>
                <button id="shop-print" class="ghost small" type="button">Print</button>
              </div>
            </div>
            <div id="shopping-list"></div>
          </section>
          <div id="info"></div>
          <div id="tips" class="tips"></div>
          </div>
        </aside>
      </main>
    </div>
    <div id="print-area" class="print-area" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
